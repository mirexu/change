name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build-flags: '-nsis'
          - os: ubuntu-latest
            platform: linux
            build-flags: '-tags webkit2_41'
          - os: macos-latest
            platform: macos
            build-flags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download FFmpeg 9.0.1 (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -sL --retry 5 --retry-all-errors -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-essentials_build.zip"
          tar -xf ffmpeg.zip
          $exe = Get-ChildItem -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Copy-Item $exe.FullName build/bin/ffmpeg.exe -Force
          build/bin/ffmpeg.exe -version

      - name: Download FFmpeg (Linux)
        if: matrix.platform == 'linux'
        run: |
          curl -sL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xf ffmpeg.tar.xz
          mkdir -p build/bin
          cp "$(find . -maxdepth 3 -path '*/bin/ffmpeg' -type f | head -1)" build/bin/ffmpeg
          chmod +x build/bin/ffmpeg
          build/bin/ffmpeg -version

      - name: Download FFmpeg 9.0.1 (macOS)
        if: matrix.platform == 'macos'
        run: |
          curl -sL --retry 5 --retry-all-errors -o ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-9.0.1.zip"
          unzip -o ffmpeg.zip
          mkdir -p build/bin
          cp ffmpeg build/bin/ffmpeg
          chmod +x build/bin/ffmpeg
          build/bin/ffmpeg -version

      - name: Setup NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          makensis -VERSION

      - name: Build
        run: wails build ${{ matrix.build-flags }}

      - name: Copy FFmpeg into macOS app bundle
        if: matrix.platform == 'macos'
        run: |
          cp build/bin/ffmpeg "build/bin/Change.app/Contents/MacOS/ffmpeg"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/change.exe, build/bin/ffmpeg.exe -DestinationPath dist/change-windows-portable.zip -Force
          $installer = Get-ChildItem build/bin/*installer*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName dist/change-windows-installer.exe }
          Get-ChildItem dist

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          # 便携版(可选)
          tar czf dist/change-linux.tar.gz -C build/bin change ffmpeg
          # 构建 .deb 安装包
          VER="${GITHUB_REF_NAME#v}"
          ROOT="pkg/change_${VER}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/change" "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" "$ROOT/usr/share/icons/hicolor/512x512/apps"
          cp build/bin/change "$ROOT/opt/change/change"
          cp build/bin/ffmpeg "$ROOT/opt/change/ffmpeg"
          ln -s /opt/change/change "$ROOT/usr/bin/change"
          cat > "$ROOT/DEBIAN/control" <<EOF
Package: change
Version: $VER
Section: utils
Priority: optional
Architecture: amd64
Maintainer: mirexu <milk_snowlk@noreply.gitcode.com>
Description: Multimedia format converter (Format Factory alternative)
EOF
          cat > "$ROOT/usr/share/applications/change.desktop" <<EOF
[Desktop Entry]
Name=Change
Comment=Multimedia format converter
Exec=/opt/change/change
Icon=change
Terminal=false
Type=Application
Categories=AudioVideo;Utility;
EOF
          cp build/appicon.png "$ROOT/usr/share/icons/hicolor/512x512/apps/change.png"
          dpkg-deb --build --root-owner-group "$ROOT" "dist/change_${VER}_amd64.deb"
          ls -la dist

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          cp build/bin/ffmpeg "build/bin/Change.app/Contents/MacOS/ffmpeg"
          hdiutil create -volname "Change" -srcfolder "build/bin/Change.app" -ov -format UDZO dist/change-macos.dmg
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: change-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          makeLatest: true
